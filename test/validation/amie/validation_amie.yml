  noise: {shot: {flag: false, seed: 2},                              # Shot Noise. 
          prnu: {flag: false, sigma: 0.02, seed: 3},                 # Photo-Response Non-Uniformity multiplicative standard deviation [%]. Not modelled for absence of data
          dark: {flag: false, sigma: 1.3245, mean: 590, seed: 1},    # Dark Current multiplicative standard deviation [%] and mean [e-/s]. Not active as it is already corrected by calibration.
